[project]
name = "mie"
version = "0.1.0"
description = "Mining Intelligence Engine: reproducible research machine for cryptocurrency-mining advantage discovery"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scipy"]

[tool.ruff]
line-length = 120
target-version = "py310"
[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: needs full datasets"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = false
