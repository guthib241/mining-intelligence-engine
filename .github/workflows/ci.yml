name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install numpy pandas scipy pytest ruff mypy
      - run: ruff check mie tests
      - run: mypy mie --ignore-missing-imports
      - run: python3 -m pytest -q -p no:warnings -m "not slow"     # slow tests need the header dataset (not in repo)
      - run: python3 -m mie lab
